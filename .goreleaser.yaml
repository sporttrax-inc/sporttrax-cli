version: 2

project_name: sporttrax

# Shell completions are generated from the cobra tree, the same source as
# docs/, so they cannot drift from the commands.
before:
  hooks:
    - mkdir -p completions
    - sh -c "go run ./cmd/sporttrax completion bash > completions/sporttrax.bash"
    - sh -c "go run ./cmd/sporttrax completion zsh  > completions/sporttrax.zsh"
    - sh -c "go run ./cmd/sporttrax completion fish > completions/sporttrax.fish"

builds:
  - main: ./cmd/sporttrax
    binary: sporttrax
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/sporttrax-inc/sporttrax-cli/internal/version.Version={{.Version}}
      - -X github.com/sporttrax-inc/sporttrax-cli/internal/version.Commit={{.ShortCommit}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # The binary is statically linked, so the MIT/BSD notices of everything
    # compiled into it have to travel with it.
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      # The cask symlinks these out of the archive, so they have to be in it —
      # declaring them under homebrew_casks.completions only writes the
      # *_completion stanzas, it does not package the files.
      - completions/*

homebrew_casks:
  - name: sporttrax
    repository:
      owner: sporttrax-inc
      name: homebrew-tap
      # The release job's GITHUB_TOKEN is scoped to this repository only,
      # so writing the cask to the tap needs a token that can reach it.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://sporttrax.com
    description: SportTrax command-line interface
    license: Apache-2.0
    binaries:
      - sporttrax
    completions:
      bash: completions/sporttrax.bash
      zsh: completions/sporttrax.zsh
      fish: completions/sporttrax.fish
    # Homebrew quarantines what a cask downloads, and this binary is not
    # yet signed or notarized, so Gatekeeper would refuse to run it on
    # first launch. Stripping the attribute is the standard workaround
    # until a Developer ID signature is in place — at which point this
    # block should go away rather than linger.
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sporttrax"]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: sporttrax-inc
    name: sporttrax-cli
